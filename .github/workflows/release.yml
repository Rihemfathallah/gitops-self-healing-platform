# EF-03 (part 2) + EF-04 — test, build and publish the image (lot 3 will add scanners)
# to GHCR, then promote it by committing the new tag to Git. Argo CD does the rest:
# nobody runs kubectl apply.
name: release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Unit tests gate the release
        working-directory: app/backend
        run: |
          pip install -r requirements.txt
          python -m pytest tests/ -q

      - name: Compute image name and tag
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/neuralrag-backend" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/backend/Dockerfile
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote — commit the new tag to gitops/releases (GitOps)
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git pull --rebase origin main
          sed -i -E "s/^  tag: .*/  tag: ${{ steps.meta.outputs.tag }}/" gitops/releases/neuralrag.yaml
          git add gitops/releases/neuralrag.yaml
          if git diff --cached --quiet; then echo "already promoted"; exit 0; fi
          git commit -m "chore(release): neuralrag ${{ steps.meta.outputs.tag }}"
          git push origin HEAD:main
