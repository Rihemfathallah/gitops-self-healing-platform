# EF-03 (part 1) — validate everything on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROMETHEUS_VERSION: "2.55.1"
  KUBECONFORM_VERSION: "0.6.7"
  HELM_VERSION: "v3.16.3"
  TERRAFORM_VERSION: "1.9.8"

jobs:
  app-tests:
    name: NeuralRAG — lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt flake8
      - name: Lint
        run: python -m flake8 . --max-line-length=120 --exclude=__pycache__,tests --count --statistics
      - name: Unit tests
        run: python -m pytest tests/ -q

  platform-validate:
    name: Platform — SLO rules, Helm, Kubernetes manifests, Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          pip install pyyaml
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: SLO rules — syntax and unit tests (promtool)
        run: make test-rules

      - name: Dashboard is up to date with its generator
        run: |
          python scripts/ci/build_dashboard.py > /tmp/dashboard.yaml
          diff -u gitops/observability/dashboard-slo.yaml /tmp/dashboard.yaml

      - name: Helm lint and render
        run: |
          helm lint charts/neuralrag -f gitops/releases/neuralrag.yaml
          helm lint infra/bootstrap
          mkdir -p build
          helm template neuralrag charts/neuralrag -n neuralrag -f gitops/releases/neuralrag.yaml > build/neuralrag.yaml
          helm template root-app infra/bootstrap -n argocd > build/bootstrap.yaml

      - name: Kubernetes schemas (kubeconform, CRDs from the community catalog)
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            build/neuralrag.yaml build/bootstrap.yaml gitops/apps gitops/observability incidents

      - name: Terraform fmt and validate
        run: |
          terraform fmt -check -recursive infra/terraform
          for root in cluster platform; do
            terraform -chdir=infra/terraform/$root init -backend=false -input=false
            terraform -chdir=infra/terraform/$root validate
          done

      - name: Experiment scripts compile
        run: python -m py_compile scripts/experiments/*.py scripts/ci/*.py
