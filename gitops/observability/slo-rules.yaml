# ─────────────────────────────────────────────────────────────────────
# NeuralRAG SLOs (EF-06) and burn-rate alerts (EF-07)
#
#   SLO 1 — availability : 99.5 % of API requests are not 5xx, over 7 days
#   SLO 2 — latency      : 95 % of API requests complete in <= 30 s
#                          (i.e. p95 <= 30 s), over 7 days
#
# Why 7 days and not 30: see docs/adr/0003-slo-window-and-burn-rates.md.
# Burn-rate thresholds follow the multi-window, multi-burn-rate method of the
# Google SRE Workbook, recomputed for a 7-day window (168 h):
#   page   : 2 % of the budget in 1 h  -> burn rate 0.02 * 168 / 1 = 3.36
#            (long window 1 h, short window 5 m)
#   ticket : 5 % of the budget in 6 h  -> burn rate 0.05 * 168 / 6 = 1.4
#            (long window 6 h, short window 30 m)
#
# Error budgets: availability 1 - 0.995 = 0.005 ; latency 1 - 0.95 = 0.05
# The latency threshold is the histogram bucket le="30.0" (metrics/sli.py).
# 30 s, not 10 s: measured baseline p95 was ~50 s for a CPU-only LLM (ADR 0003).
# Tested by tests/prometheus/slo-rules.test.yaml (promtool test rules).
# ─────────────────────────────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: neuralrag-slo
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: neuralrag
spec:
  groups:
    - name: neuralrag-sli
      interval: 30s
      rules:
        # ── Availability SLI: ratio of 5xx responses ──────────────────
        - record: neuralrag:sli_errors:ratio_rate5m
          expr: |
            (sum(rate(http_requests_total{job="neuralrag-backend", code=~"5.."}[5m])) or vector(0))
            / sum(rate(http_requests_total{job="neuralrag-backend"}[5m]))
        - record: neuralrag:sli_errors:ratio_rate30m
          expr: |
            (sum(rate(http_requests_total{job="neuralrag-backend", code=~"5.."}[30m])) or vector(0))
            / sum(rate(http_requests_total{job="neuralrag-backend"}[30m]))
        - record: neuralrag:sli_errors:ratio_rate1h
          expr: |
            (sum(rate(http_requests_total{job="neuralrag-backend", code=~"5.."}[1h])) or vector(0))
            / sum(rate(http_requests_total{job="neuralrag-backend"}[1h]))
        - record: neuralrag:sli_errors:ratio_rate6h
          expr: |
            (sum(rate(http_requests_total{job="neuralrag-backend", code=~"5.."}[6h])) or vector(0))
            / sum(rate(http_requests_total{job="neuralrag-backend"}[6h]))

        # ── Latency SLI: ratio of requests slower than 30 s ───────────
        - record: neuralrag:sli_slow:ratio_rate5m
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{job="neuralrag-backend", le="30.0"}[5m]))
              / sum(rate(http_request_duration_seconds_count{job="neuralrag-backend"}[5m]))
            )
        - record: neuralrag:sli_slow:ratio_rate30m
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{job="neuralrag-backend", le="30.0"}[30m]))
              / sum(rate(http_request_duration_seconds_count{job="neuralrag-backend"}[30m]))
            )
        - record: neuralrag:sli_slow:ratio_rate1h
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{job="neuralrag-backend", le="30.0"}[1h]))
              / sum(rate(http_request_duration_seconds_count{job="neuralrag-backend"}[1h]))
            )
        - record: neuralrag:sli_slow:ratio_rate6h
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{job="neuralrag-backend", le="30.0"}[6h]))
              / sum(rate(http_request_duration_seconds_count{job="neuralrag-backend"}[6h]))
            )

        # ── Observed p95 (dashboard only, the SLO uses the ratio above) ─
        - record: neuralrag:latency_seconds:p95_rate5m
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{job="neuralrag-backend"}[5m])))

    - name: neuralrag-slo-budget
      # 7-day ranges are expensive: evaluate every 5 minutes only.
      interval: 5m
      rules:
        - record: neuralrag:slo_availability:target
          expr: vector(0.995)
        - record: neuralrag:slo_latency:target
          expr: vector(0.95)
        - record: neuralrag:sli_errors:ratio_rate7d
          expr: |
            (sum(increase(http_requests_total{job="neuralrag-backend", code=~"5.."}[7d])) or vector(0))
            / sum(increase(http_requests_total{job="neuralrag-backend"}[7d]))
        - record: neuralrag:sli_slow:ratio_rate7d
          expr: |
            1 - (
              sum(increase(http_request_duration_seconds_bucket{job="neuralrag-backend", le="30.0"}[7d]))
              / sum(increase(http_request_duration_seconds_count{job="neuralrag-backend"}[7d]))
            )
        # Share of the 7-day error budget still available (1 = untouched, <0 = SLO missed)
        - record: neuralrag:slo_availability:error_budget_remaining
          expr: 1 - (neuralrag:sli_errors:ratio_rate7d / 0.005)
        - record: neuralrag:slo_latency:error_budget_remaining
          expr: 1 - (neuralrag:sli_slow:ratio_rate7d / 0.05)

    - name: neuralrag-slo-alerts
      interval: 30s
      rules:
        # ── Availability ─────────────────────────────────────────────
        - alert: NeuralRAGAvailabilityBudgetFastBurn
          expr: |
            neuralrag:sli_errors:ratio_rate1h > (3.36 * 0.005)
            and
            neuralrag:sli_errors:ratio_rate5m > (3.36 * 0.005)
          for: 1m
          labels:
            severity: page
            team: neuralrag
            slo: availability
          annotations:
            summary: "NeuralRAG burns its availability error budget too fast"
            description: "More than 1.68 % of requests failed over both the last 1h and the last 5m: at this rate 2 % of the 7-day budget is gone within the hour. Current ratio on the SLO dashboard."
            runbook_url: "https://github.com/Rihemfathallah/gitops-self-healing-platform/blob/main/docs/runbook.md#availability-burn"
        - alert: NeuralRAGAvailabilityBudgetSlowBurn
          expr: |
            neuralrag:sli_errors:ratio_rate6h > (1.4 * 0.005)
            and
            neuralrag:sli_errors:ratio_rate30m > (1.4 * 0.005)
          for: 5m
          labels:
            severity: ticket
            team: neuralrag
            slo: availability
          annotations:
            summary: "NeuralRAG availability error budget is eroding"
            description: "More than 0.7 % of requests failed over both the last 6h and the last 30m."
            runbook_url: "https://github.com/Rihemfathallah/gitops-self-healing-platform/blob/main/docs/runbook.md#availability-burn"

        # ── Latency ──────────────────────────────────────────────────
        - alert: NeuralRAGLatencyBudgetFastBurn
          expr: |
            neuralrag:sli_slow:ratio_rate1h > (3.36 * 0.05)
            and
            neuralrag:sli_slow:ratio_rate5m > (3.36 * 0.05)
          for: 1m
          labels:
            severity: page
            team: neuralrag
            slo: latency
          annotations:
            summary: "NeuralRAG burns its latency error budget too fast"
            description: "More than 16.8 % of requests took over 30 s, over both the last 1h and the last 5m."
            runbook_url: "https://github.com/Rihemfathallah/gitops-self-healing-platform/blob/main/docs/runbook.md#latency-burn"
        - alert: NeuralRAGLatencyBudgetSlowBurn
          expr: |
            neuralrag:sli_slow:ratio_rate6h > (1.4 * 0.05)
            and
            neuralrag:sli_slow:ratio_rate30m > (1.4 * 0.05)
          for: 5m
          labels:
            severity: ticket
            team: neuralrag
            slo: latency
          annotations:
            summary: "NeuralRAG latency error budget is eroding"
            description: "More than 7 % of requests took over 30 s, over both the last 6h and the last 30m."
            runbook_url: "https://github.com/Rihemfathallah/gitops-self-healing-platform/blob/main/docs/runbook.md#latency-burn"

        # ── Symptom alerts the request-based SLIs cannot see ─────────
        # When no pod is up, no request reaches the app, so the SLIs go silent.
        - alert: NeuralRAGBackendDown
          expr: |
            (sum(up{job="neuralrag-backend"}) or vector(0)) == 0
          for: 1m
          labels:
            severity: page
            team: neuralrag
            slo: availability
          annotations:
            summary: "No NeuralRAG backend pod is serving"
            description: "Prometheus scrapes no healthy backend target: the API is fully down."
            runbook_url: "https://github.com/Rihemfathallah/gitops-self-healing-platform/blob/main/docs/runbook.md#backend-down"
        - alert: NeuralRAGRolloutAborted
          expr: |
            max(rollout_info{namespace="neuralrag", name="neuralrag-backend", phase="Degraded"}) == 1
          for: 0m
          labels:
            severity: ticket
            team: neuralrag
            slo: release
          annotations:
            summary: "A NeuralRAG release was rolled back automatically"
            description: "The canary analysis failed; traffic is back on the last healthy version. Revert or fix the release in Git."
            runbook_url: "https://github.com/Rihemfathallah/gitops-self-healing-platform/blob/main/docs/runbook.md#rollout-aborted"
