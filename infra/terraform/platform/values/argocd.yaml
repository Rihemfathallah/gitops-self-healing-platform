# Argo CD — lean install for a laptop (no Dex, no notifications)
dex:
  enabled: false
notifications:
  enabled: false

configs:
  params:
    server.insecure: true
  cm:
    # Poll Git every 60 s (default 180 s) so a commit is picked up quickly.
    timeout.reconciliation: 60s
    # App of apps: give child Applications a health status so sync waves wait
    # for the previous wave to be Healthy (CRDs before the resources using them).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

server:
  service:
    type: NodePort
    nodePortHttp: 30443
    nodePortHttps: 30444

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
