# Default values. Release-specific values (image tag, injected faults) live in
# gitops/releases/neuralrag.yaml, which Argo CD layers on top of this file.

image:
  repository: ghcr.io/rihemfathallah/neuralrag-backend
  tag: main
  pullPolicy: IfNotPresent

release:
  # Free text, copied to a pod annotation; changing it creates a new revision.
  id: baseline
  # Fault injection (EF-10). All off = healthy release.
  chaos:
    errorRate: "0"
    latencyMs: "0"
    crashOnStart: "false"

backend:
  replicas: 2
  nodePort: 30080
  logLevel: info
  # Server keep-alive. Must exceed the idle time of every client (k6 waits 5 s
  # between requests): with uvicorn's default 5 s, the server sometimes closed a
  # connection just as k6 reused it, and k6 saw "EOF" that the server never
  # counted (k6 baseline, 3/31 requests). See ADR 0003, limits.
  keepAliveSeconds: 75
  # Chunks sent to the LLM per question (original default 5); fewer = shorter prompt.
  topK: 2
  apiKeySecret: neuralrag-api   # created by Terraform, never in Git
  resources:
    requests: { cpu: 100m, memory: 600Mi }
    limits: { memory: 1536Mi }

rollout:
  # Basic canary: with 2 replicas, 50 % = 1 canary pod + 1 stable pod.
  canaryWeight: 50
  # Observation time of the canary. The background analysis only runs while the
  # rollout is not finished: 4 min was too short to see two slow answers of a
  # canary that gets ~1 request a minute, each taking 50+ s (ADR 0002).
  pauseDuration: 6m
  # Backstop for a release whose pods never become ready; the canary-restarts
  # metric of the analysis normally aborts a crash loop well before.
  progressDeadlineSeconds: 300

analysis:
  initialDelay: 60s
  interval: 30s
  # No count: the background analysis measures for as long as the canary runs.
  # With count 8 it ended after 4.5 min, possibly before the canary had served
  # enough slow requests to fail (ADR 0002).
  count: null
  failureLimit: 1
  # Rate window of each measurement. The canary gets only a few requests per
  # minute, so 1m windows were too noisy (one slow answer = 50 % "slow").
  window: 2m
  prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
  # Canary fails if more than 5 % of its requests are 5xx...
  maxErrorRatio: 0.05
  # ...or if more than half of its requests are slower than the latency SLO threshold.
  # The canary check looks for a clear regression (a release adding 40 s is always
  # caught); the 95 % target itself is tracked by the SLO and its error budget.
  # Ollama is shared by stable and canary, so an isolated slow answer is not the
  # canary's fault. First real canary: aborted on 1 slow sample out of ~2 (ADR 0002).
  maxSlowRatio: 0.5
  # ...or if a canary container restarted (crash loop, liveness kill, OOM).
  maxCanaryRestarts: 0

slo:
  # Must be one of the histogram buckets of metrics/sli.py, written as the
  # Python client renders it ("10.0", not "10"). Keep in sync with
  # gitops/observability/slo-rules.yaml.
  latencyThresholdLe: "30.0"

chromadb:
  image: chromadb/chroma:0.5.0
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }

ollama:
  image: ollama/ollama:0.9.0
  model: qwen2.5:0.5b
  # Cap the answer length: bounded output = bounded latency on CPU.
  numPredict: 96
  storage: 3Gi
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 3Gi }

trafficGenerator:
  # Steady "normal" traffic: feeds the SLIs, the canary analysis and the
  # 24 h false-positive measurement.
  enabled: true
  image: curlimages/curl:8.11.0
  # Open loop: one question every 30 s, whatever the response time (each curl runs
  # in the background). The former loop waited for the answer, then 15 s: a slow
  # service received fewer requests, which diluted the slow ratio and hid the
  # latency incident (ADR 0003). Same average load as before (~2 questions/min).
  intervalSeconds: 30
  timeoutSeconds: 120
