{{- $sel := printf "namespace=\"%s\", pod=~\"neuralrag-backend-{{args.canary-hash}}-.*\"" .Release.Namespace -}}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: neuralrag-canary
  labels:
    {{- include "neuralrag.labels" . | nindent 4 }}
spec:
  args:
    - name: canary-hash
  metrics:
    # SLI 1 — availability of the canary pods only.
    - name: canary-error-ratio
      initialDelay: {{ .Values.analysis.initialDelay }}
      interval: {{ .Values.analysis.interval }}
      {{- with .Values.analysis.count }}
      count: {{ . }}
      {{- end }}
      failureLimit: {{ .Values.analysis.failureLimit }}
      successCondition: result[0] <= {{ .Values.analysis.maxErrorRatio }}
      provider:
        prometheus:
          address: {{ .Values.analysis.prometheusAddress }}
          query: |
            (
              (sum(rate(http_requests_total{ {{ $sel }}, code=~"5.." }[{{ .Values.analysis.window }}])) or vector(0))
              /
              (sum(rate(http_requests_total{ {{ $sel }} }[{{ .Values.analysis.window }}])) > 0)
            ) or vector(0)
    # SLI 2 — share of canary requests slower than the latency SLO threshold.
    - name: canary-slow-ratio
      initialDelay: {{ .Values.analysis.initialDelay }}
      interval: {{ .Values.analysis.interval }}
      {{- with .Values.analysis.count }}
      count: {{ . }}
      {{- end }}
      failureLimit: {{ .Values.analysis.failureLimit }}
      successCondition: result[0] <= {{ .Values.analysis.maxSlowRatio }}
      provider:
        prometheus:
          address: {{ .Values.analysis.prometheusAddress }}
          query: |
            (
              1 - (
                sum(rate(http_request_duration_seconds_bucket{ {{ $sel }}, le="{{ .Values.slo.latencyThresholdLe }}" }[{{ .Values.analysis.window }}]))
                /
                (sum(rate(http_request_duration_seconds_count{ {{ $sel }} }[{{ .Values.analysis.window }}])) > 0)
              )
            ) or vector(0)
    # Signal 3 — restarts of the canary pods. A crash-looping canary serves no
    # request, so both SLIs above stay at "no data" (= success); without this metric
    # only progressDeadlineAbort caught it, after ~9 min (ADR 0002).
    - name: canary-restarts
      initialDelay: {{ .Values.analysis.initialDelay }}
      interval: {{ .Values.analysis.interval }}
      {{- with .Values.analysis.count }}
      count: {{ . }}
      {{- end }}
      failureLimit: {{ .Values.analysis.failureLimit }}
      successCondition: result[0] <= {{ .Values.analysis.maxCanaryRestarts }}
      provider:
        prometheus:
          address: {{ .Values.analysis.prometheusAddress }}
          query: |
            sum(kube_pod_container_status_restarts_total{ {{ $sel }}, container="backend" }) or vector(0)
